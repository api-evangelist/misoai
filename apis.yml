- aid: misoai:misoai-bulk-api-api
  name: miso.ai Bulk API API
  description: "The Bulk API provides an efficient interface for making multiple Search / Recommendations\
    \ / Q&A requests in one API\ncall. These requests will be executed concurrently at the Miso side,\
    \ and returned at once when all of them are finished.\nThis API is particularly useful when you need\
    \ to invoke multiple Miso APIs to respond to a user request.\nUsing this API, you can batch multiple\
    \ API calls into one, and significantly save the network round-trip times.\n\n### Request schema\n\
    The request schema for this API call is as follow:\n```\nPOST /v1/bulk\n{\n  \"requests\": [\n   \
    \ {\n      \"api_name\": \"search/search\",\n      \"body\": { ... }\n    },\n    {\n      \"api_name\"\
    : \"recommendation/product_to_product\",\n      \"body\": { ... }\n    },\n    ...\n  ]\n}\n```\n\
    Each request object should contain:\n* **api_name**: name of the API you want to access. The name\
    \ should contain a slash `/`.\nFor example, search/search for search requests, search/autocomplete\
    \ for autocomplete requests, etc.\n* **body**: the complete request body as if you are making the\
    \ API request individually.\n\nAny errors in one of the requests will be returned, and will not prevent\
    \ other requests from being\nexecuted.\n\n### Response Schema\nBulk API endpoint will return the API\
    \ responses in the same order as they appear in the request.\nFor example, if the Bulk API request\
    \ is like the following:\n```\nPOST /v1/bulk\n{\n  \"requests\": [\n    {... request 1 ...},\n   \
    \ {... request 2 ...}\n  ]\n}\n``` \n\nThe response will be like:\n```\n{\n  \"data\": [\n    // response\
    \ for request 1\n    {\n      \"error\": false,\n      \"status_code\": 200,\n      \"body\": { ...\
    \ }\n    },\n    // response for request 2\n    {\n      \"error\": false,\n      \"status_code\"\
    : 200,\n      \"body\": { ... }\n    }\n  ]\n}\n```\n\nEach response object will contain the following\
    \ fields:\n* **error**: whether there was an error with the request. You should check this field to\
    \ determine whether to\nperform error handling.\n* **status_code**: status code of the request.\n\
    * **body**: the response body of the request (as if the request was sent individually).\n\nLet's see\
    \ a complete example with MovieLens data. The following requests will issue two requests in one API\
    \ call that \nreturn the `Sci-Fi` movies directed by\n*Ridley Scott*, and *James Cameron* respectively\
    \ in the first and second responses:\n```\nPOST /v1/bulk\n{\n  \"requests\": [\n    {\n      \"api_name\"\
    : \"search/search\",\n      \"body\": {\n        \"user_id\": \"test_user\",\n        \"q\": \"sci-fi\"\
    ,\n        \"fq\": \"custom_attributes.director:\\\"Ridley Scott\\\"\"\n      }\n    },\n    {\n \
    \     \"api_name\": \"search/search\",\n      \"body\": {\n        \"user_id\": \"test_user\",\n \
    \       \"q\": \"sci-fi\",\n        \"fq\": \"custom_attributes.director:\\\"James Cameron\\\"\"\n\
    \      }\n    }\n  ]\n}\n```\nThe response will be like:\n```\n{\n  \"data\": [\n    {\n      \"error\"\
    : false,\n      \"status_code\": 200,\n      \"body\": {\n        \"data\": {\n          \"took\"\
    : 136,\n          \"miso_id\": \"19ab254c-5fb8-11ec-bd48-b20169940af9\",\n          \"products\":\
    \ [\n            {\n              \"product_id\": \"blade-runner\",\n              \"title\": \"Blade\
    \ Runner (1982)\"\n            }\n          ],\n          \"total\": 6,\n          \"start\": 0\n\
    \        }\n      }\n    },\n    {\n      \"error\": false,\n      \"status_code\": 200,\n      \"\
    body\": {\n        \"data\": {\n          \"took\": 116,\n          \"miso_id\": \"19ab254c-5fb8-11ec-bd48-b20169940af9\"\
    ,\n          \"products\": [\n            {\n              \"product_id\": \"avatar\",\n         \
    \     \"title\": \"Avatar (2009)\"\n            }\n          ],\n          \"total\": 10,\n      \
    \    \"start\": 0\n        }\n      }\n    }\n  ]\n}\n```"
  humanURL: https://docs.miso.ai/api-reference/introduction
  baseURL: https://api.askmiso.com

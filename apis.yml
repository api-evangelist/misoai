- aid: misoai:misoai-user-apis-api
  name: miso.ai User APIs API
  description: >-
    Miso’s User APIs let you upload, read, and delete User records that tell Miso about your site’s unique
    users and

    visitors.


    ### User records

    User records specify relatively static attributes for a given user, such as their `age`, `gender`,
    `city`, etc. As a

    rule of thumb, you should put information here that is not already captured in your

    [Interaction records](#tag/Interaction-APIs). For example, *last_bought_product* is probably not needed
    here because

    Miso already can tell that from the [Interaction records](#tag/Interaction-APIs).


    Miso will discover the correlations between a user's attributes and their behaviors on your site.
    For example, Miso

    might determine that users of a certain age group tend to be interested in certain products or a certain
    price

    range. These insights will be taken into account when predicting users' interests, in particular for
    new users who

    have not yet generated many interaction records.


    We define a set of common user attributes for e-Commerce and content media sites. Some of them, such
    as `name` are

    for display in the Dojo dashboard only. The rest are for model quality. Most attributes are optional
    and you don't

    need to specify them if you don't collect such data. On the other hand, you can specify your custom
    user attributes

    in the `custom_attributes` field. Miso will analyze custom user attributes to improve the model quality
    as well.
  humanURL: https://docs.miso.ai/api-reference/introduction

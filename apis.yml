- aid: misoai:misoai-ask-apis-api
  name: miso.ai Ask APIs API
  description: "Miso's new Ask API is the next generation of question answering APIs.\nIt is designed\
    \ to provide accurate and concise answers to your questions\nbased on your existing product documents.\n\
    \nAsk API offers a seamless and effective way to address complex queries in\na near-realtime fasion.\n\
    \nMiso preprocesses your product documents, breaking them into segments.\nWhen a question is received,\
    \ Miso finds the most related product and segments, then\nsummarize to a concise and informative answer\
    \ based on the identified segments,\nincluding products related to the question.\n\nPossible use case\
    \ includes: knowledge base, documentation search, customer support, and more.\n\nTo use the Ask API,\
    \ you first submit a \"question\" you want to ask.\nQuestion can be any human-readable text. Then\
    \ a question ID will returned,\nand the question will be processed in the background.\n\nAfter receving\
    \ question ID, you can then use the question ID to get latest answer\nto the question as it is being\
    \ compiled.\n\n----\n\nFor example:\n\nIf you want to know about the inner workings of nginx:\n\n\
    ```json\n{\n    \"question\":\"How nginx works internally?\"\n}\n```\n\nThe API would response with\
    \ a question id.\n```json\n{\n    \"data\": {\n        \"question_id\": \"ff4775fa-345e-4d28-91b0-8fb8bf095e6a\"\
    \n    },\n    \"message\": \"success\"\n}\n```\n\nThen you can send a GET request to `/v1/ask/questions/{question_id}/answer`\n\
    to get the latest answer as it is being compiled and summerized.\nYou can use `answer_stage` and `finished`\
    \ to check current answer status.\n\nHere's the response of answer API when data is fetched and being\
    \ verified, before answer is summerized:\n```json\n{\n    \"message\": \"success\",\n    \"data\"\
    : {\n        \"question\": \"How nginx works internally?\",\n        \"question_id\": \"ff4775fa-345e-4d28-91b0-8fb8bf095e6a\"\
    ,\n        \"parent_question_id\": null,\n        \"answer_stage\": \"Verifying possible answers\"\
    ,\n        \"finished\": false,\n        \"answer\": \"Verifying possible answers ...\",\n       \
    \ \"sources\": [],\n        \"related_resources\": [],\n        \"followup_questions\": []\n    }\n\
    }\n```\n\nHere's the response when answer is fullly summerized:\n\n```json\n{\n    \"message\": \"\
    success\",\n    \"data\": {\n        \"question\": \"How nginx works internally?\",\n        \"question_id\"\
    : \"ff4775fa-345e-4d28-91b0-8fb8bf095e6a\",\n        \"parent_question_id\": null,\n        \"answer_stage\"\
    : \"Generating summary\",\n        \"finished\": true,\n        \"answer\": \"# How does Nginx work\
    \ internally?\\n\\n## Internal requests [1]\\n\\nNginx differentiates\nbetween external and internal\
    \ requests. External requests...[omitted for simplicity]\",\n        \"sources\": [\n            {\n\
    \                \"title\": \"Internal requests\",\n                \"product_id\": \"9781788623551\"\
    ,\n                \"child_title\": \"Internal requests\",\n                \"child_id\": \"203\"\
    ,\n                \"snippet\": \"&lt;mark&gt;Internal requests\\nNginx differentiates external and\
    \ internal\nrequests.&lt;/mark&gt;\"\n            },\n            {\n                \"title\": \"\
    5. Nginx Core Architecture\",\n                \"product_id\": \"9781484216569\",\n              \
    \  \"child_title\": \"5. Nginx Core Architecture\",\n                \"child_id\": \"5\",\n      \
    \          \"snippet\": \"Checks if the client can access of the requested the resource.\\n&lt;mark&gt;It\n\
    is at this step that Nginx...[omitted]&lt;/mark&gt;\"\n            },\n            {\n           \
    \     \"title\": \"2. Managing Nginx\",\n                \"product_id\": \"9781785289538\",\n    \
    \            \"child_title\": \"2. Managing Nginx\",\n                \"child_id\": \"14\",\n    \
    \            \"snippet\": \"&lt;mark&gt;The Nginx connection processing architecture\\nBefore you\
    \ study...[omitted]&lt;/mark&gt;\"\n            },\n            {\n                \"title\": \"3.\
    \ Nginx Core Directives\",\n                \"product_id\": \"9781484216569\",\n                \"\
    child_title\": \"3. Nginx Core Directives\",\n                \"child_id\": \"3\",\n             \
    \   \"snippet\": \"&lt;mark&gt;Understanding the Default Configuration\\nThe default configuration...[omitted]&lt;/mark&gt;\"\
    \n            },\n            {\n                \"title\": \"4. Nginx Modules\",\n              \
    \  \"product_id\": \"9781484216569\",\n                \"child_title\": \"4. Nginx Modules\",\n  \
    \              \"child_id\": \"4\",\n                \"snippet\": \"&lt;mark&gt;Based on the context\
    \ like HTTP, MAIL, and STREAM, it creates\na ...[omitted]&lt;/mark&gt;\"\n            }\n        ],\n\
    \        \"related_resources\": [],\n        \"followup_questions\": [\n            \"What are the\
    \ steps involved in processing a request and generating a response in Nginx?\",\n            \"How\
    \ do Nginx modules contribute to the internal workings of Nginx?\"\n        ]\n    }\n}\n```\n\nRelated\
    \ product IDs will be returned along with human-readable answer. Related text section in the product\
    \ will also be quoted.\n\nIf a product has any children, they will also be matched, `child_id` and\
    \ `child_title` will be included for sources belonging to the product's children.\n\nYou can use `fq`\
    \ to limit the search scope, for example, to a specific product type or other condition.\n\nIf you\
    \ only want to search for books (no articles of videos), you can use `fq=type:book` like this:\n```json\n\
    {\n    \"question\":\"How nginx works internally?\"\n    \"fq\": \"type:book\"\n}\n```\n\nIf you want\
    \ the answer to contain any other fields, set `source_fl` when submitting the question."

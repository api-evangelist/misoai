- aid: misoai:misoai-ask-apis-api
  name: miso.ai Ask APIs API
  description: >-
    Miso's new Ask API is the next generation of question answering APIs.

    It is designed to provide accurate and concise answers to your questions

    based on your existing product documents.


    Ask API offers a seamless and effective way to address complex queries in

    a near-realtime fasion.


    Miso preprocesses your product documents, breaking them into segments.

    When a question is received, Miso finds the most related product and segments, then

    summarize to a concise and informative answer based on the identified segments,

    including products related to the question.


    Possible use case includes: knowledge base, documentation search, customer support, and more.


    To use the Ask API, you first submit a "question" you want to ask.

    Question can be any human-readable text. Then a question ID will returned,

    and the question will be processed in the background.


    After receving question ID, you can then use the question ID to get latest answer

    to the question as it is being compiled.


    ----


    For example:


    If you want to know about the inner workings of nginx:


    ```json

    {
        "question":"How nginx works internally?"
    }

    ```


    The API would response with a question id.

    ```json

    {
        "data": {
            "question_id": "ff4775fa-345e-4d28-91b0-8fb8bf095e6a"
        },
        "message": "success"
    }

    ```


    Then you can send a GET request to `/v1/ask/questions/{question_id}/answer`

    to get the latest answer as it is being compiled and summerized.

    You can use `answer_stage` and `finished` to check current answer status.


    Here's the response of answer API when data is fetched and being verified, before answer is summerized:

    ```json

    {
        "message": "success",
        "data": {
            "question": "How nginx works internally?",
            "question_id": "ff4775fa-345e-4d28-91b0-8fb8bf095e6a",
            "parent_question_id": null,
            "answer_stage": "Verifying possible answers",
            "finished": false,
            "answer": "Verifying possible answers ...",
            "sources": [],
            "related_resources": [],
            "followup_questions": []
        }
    }

    ```


    Here's the response when answer is fullly summerized:


    ```json

    {
        "message": "success",
        "data": {
            "question": "How nginx works internally?",
            "question_id": "ff4775fa-345e-4d28-91b0-8fb8bf095e6a",
            "parent_question_id": null,
            "answer_stage": "Generating summary",
            "finished": true,
            "answer": "# How does Nginx work internally?\n\n## Internal requests [1]\n\nNginx differentiates
    between external and internal requests. External requests...[omitted for simplicity]",
            "sources": [
                {
                    "title": "Internal requests",
                    "product_id": "9781788623551",
                    "child_title": "Internal requests",
                    "child_id": "203",
                    "snippet": "&lt;mark&gt;Internal requests\nNginx differentiates external and internal
    requests.&lt;/mark&gt;"
                },
                {
                    "title": "5. Nginx Core Architecture",
                    "product_id": "9781484216569",
                    "child_title": "5. Nginx Core Architecture",
                    "child_id": "5",
                    "snippet": "Checks if the client can access of the requested the resource.\n&lt;mark&gt;It
    is at this step that Nginx...[omitted]&lt;/mark&gt;"
                },
                {
                    "title": "2. Managing Nginx",
                    "product_id": "9781785289538",
                    "child_title": "2. Managing Nginx",
                    "child_id": "14",
                    "snippet": "&lt;mark&gt;The Nginx connection processing architecture\nBefore you study...[omitted]&lt;/mark&gt;"
                },
                {
                    "title": "3. Nginx Core Directives",
                    "product_id": "9781484216569",
                    "child_title": "3. Nginx Core Directives",
                    "child_id": "3",
                    "snippet": "&lt;mark&gt;Understanding the Default Configuration\nThe default configuration...[omitted]&lt;/mark&gt;"
                },
                {
                    "title": "4. Nginx Modules",
                    "product_id": "9781484216569",
                    "child_title": "4. Nginx Modules",
                    "child_id": "4",
                    "snippet": "&lt;mark&gt;Based on the context like HTTP, MAIL, and STREAM, it creates
    a ...[omitted]&lt;/mark&gt;"
                }
            ],
            "related_resources": [],
            "followup_questions": [
                "What are the steps involved in processing a request and generating a response in Nginx?",
                "How do Nginx modules contribute to the internal workings of Nginx?"
            ]
        }
    }

    ```


    Related product IDs will be returned along with human-readable answer. Related text section in the
    product will also be quoted.


    If a product has any children, they will also be matched, `child_id` and `child_title` will be included
    for sources belonging to the product's children.


    You can use `fq` to limit the search scope, for example, to a specific product type or other condition.


    If you only want to search for books (no articles of videos), you can use `fq=type:book` like this:

    ```json

    {
        "question":"How nginx works internally?"
        "fq": "type:book"
    }

    ```


    If you want the answer to contain any other fields, set `source_fl` when submitting the question.

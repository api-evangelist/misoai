- aid: misoai:misoai-experiment-apis-api
  name: miso.ai Experiment APIs API
  description: "Miso's experiment APIs let you do the A/B testing of your current result with Miso.\n\n\
    ### Start an experiment in Dojo.\n\nLogin to the [dojo](https://dojo.askmiso.com) platform.\nCreate\
    \ an experiment event for you.\n\n### Start running A/B testing in your environment.\n\n#### Implement\
    \ A/B testing code.\n\nHere's an example in NodeJS. You can also use any programming language of you\
    \ choice.\n```nodejs\nconst axios = require('axios');\n\nasync function get_user_experiment_info(api_key,\
    \ experiment_id, user_id) {\n    data = {\"user_id\": user_id}\n    endpoint = `https://api.askmiso.com/v1/experiments/${experiment_id}/events?api_key=${api_key}`\n\
    \    return await axios.post(endpoint, data)\n}\n\nconst api_key = '<YOUR_SECRET_API_KEY>'\nconst\
    \ experiment_id = \"<EXPERIMENT_ID | EXPERIMENT_SLUG_NAME>\"\nlet user_id = 'user_1234'  // use to\
    \ evaluate a treatment for\n\nconst user_experiment_info = get_user_experiment_info(api_key, experiment_id,\
    \ user_id)\nuser_experiment_info.then((response) => {\n    let variant = response.data['variant']\n\
    \    if (variant['name'] == \"treatment\") {\n        // insert code here to show \"treatment\" variant\n\
    \    } else if (variant['name'] == \"control\") {\n        // insert code here to show \"control\"\
    \ variant\n    } else {\n        // unexpected variant name. raise error\n        throw new Error(`Unexpected\
    \ variant name ${variant[\"name\"]}`)\n    }\n})\n```\n\nIf you implement A/B testing code in FrontEnd,\
    \ like JavaScript, and are also worried about exploding the secret api_key. You can choose to use\
    \ anonymous_id with the public_api_key for this API. Here's an example.\n\n```javascript\nconst apiKey\
    \ = '<YOUR_PUBLIC_API_KEY>';\nconst experimentId = '<EXPERIMENT_ID | EXPERIMENT_SLUG_NAME>';\nconst\
    \ anonymous_id = 'user_1234';  // use to evaluate a treatment for\n\nfunction getUserExperimentInfo(apiKey,\
    \ experimentId, anonymous_id) {\n  const data = {\n    user_id: anonymous_id\n  };\n  const url =\
    \ `https://api.askmiso.com/v1/experiments/${experimentId}/events?api_key=${apiKey}`;\n  const options\
    \ = {\n    method: 'POST',\n    headers: {\n      'Content-Type': 'application/json',\n    },\n  \
    \  body: JSON.stringify(data),\n  };\n\n  return window.fetch(url, options)\n    .then((response)\
    \ => response.json())\n    .then((data) => {\n      const variantName = data.variant.name;\n     \
    \ if (variantName === `${this.treatmentName}`) {\n        // insert code here to show 'treatment'\
    \ variant\n      } else if (variantName === `${this.controlName}`) {\n        // insert code here\
    \ to show 'control' variant\n      } else {\n        // unexpected variant name, throw error\n   \
    \     throw new Error(`Unexpected variant name: ${variantName}`);\n      }\n    })\n    .catch((error)\
    \ => console.error(error));\n}\n\ngetUserExperimentInfo(apiKey, experimentId, anonymous_id);\n```"

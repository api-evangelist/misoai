name: miso.ai
description: Miso (Miso Technologies, askmiso.com) is an AI personalization, search, and answers platform
  for publishers, media companies, and retailers. Miso trains machine-learning "Engines" on three data
  sets a site already has — its log of historical and real-time user interactions, its catalog of products/content,
  and its users — and exposes the output as REST APIs for personalized semantic search, typo-tolerant
  autocomplete, product and user recommendations, and an LLM-grounded Q&A / "Answers" experience that
  answers questions using only the customer's own content (reducing hallucination). The platform ships
  JavaScript (client + server), Python, and PHP SDKs, a WordPress plugin, embeddable Ask / Explore / Hybrid
  Search web modules, and the Dojo console for training engines and managing API keys and environments.

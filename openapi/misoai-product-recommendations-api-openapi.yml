      type: object
      properties:
        type:
          title: Type
          enum:
          - add_to_cart
          type: string
          description: '

            Used when a user adds a product into their shopping cart. This is a strong

            positive signal of the user''s interest in the product, and may eventually lead to a purchase.

            '
        quantities:
          title: Quantities
          anyOf:
          - type: array
            items:
              type: number
          - type: number
          description: '

            The quantities of products the user adds to their cart or checks out with. This field should be a list of positive values.

            Specifically, if `product_ids` is a list of N products, the `quantities` needs to be a list with N numbers as well.

            If `quantities` are not specified, we will assume the quantity to be 1 for every product.


            Example:

            ```

            {"quantities": [1, 2]}

            ```

